<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173f39">
<title>رُكن | RUKN</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f5f3ed;
  font-family: Arial, sans-serif;
  color: #173f39;
  text-align: center;
}
.card {
  width: 90%;
  max-width: 420px;
  background: white;
  padding: 38px 24px;
  border-radius: 24px;
  box-shadow: 0 8px 30px #00000012;
}
.logo {
  font-size: 55px;
  font-weight: bold;
  color: #07534c;
}
h1 { font-size: 30px; }
p {
  color: #806044;
  line-height: 2;
  font-size: 17px;
}
button {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #173f39;
  color: white;
  font-size: 18px;
  font-weight: bold;
  margin-top: 20px;
  cursor: pointer;
}
small {
  display: block;
  margin-top: 25px;
  color: #888;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">رُكن</div>
  <h1>أهلاً بكم في رُكن 🤎</h1>
  <p>
    خلكم قريبين منا!
    اشتركوا في إشعارات رُكن
    لتصلكم العروض والمفاجآت
    والمنتجات الجديدة.
  </p>
  <button disabled>
    تفعيل الإشعارات قريباً 🔔
  </button>
  <small>RUKN CAFE · سيئون</small>
</div>
</body>
</html>
